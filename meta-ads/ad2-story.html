<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;font-family:'Inter','Helvetica Neue',sans-serif;
  background:#fff;color:#0a0a0a;overflow:hidden;position:relative}
.top{padding:80px 64px 40px;text-align:center}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;
  color:#a3a3a3;margin-bottom:16px}
h1{font-size:52px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.product-img{width:100%;height:800px;object-fit:contain;display:block;padding:0 40px}
.bottom{padding:40px 64px 80px;text-align:center}
.stats{display:flex;justify-content:center;gap:48px;margin-bottom:32px}
.stat-num{font-size:36px;font-weight:700}
.stat-label{font-size:12px;color:#a3a3a3;text-transform:uppercase;letter-spacing:1.5px;margin-top:4px}
.price-row{display:flex;align-items:baseline;justify-content:center;gap:16px;margin-bottom:24px}
.price{font-size:52px;font-weight:700}
.price-cross{font-size:28px;color:#a3a3a3;text-decoration:line-through;font-weight:400}
.free{font-size:18px;color:#2d8a4e;font-weight:600}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="top">
  <p class="eyebrow">Hybrid Training Shoe</p>
  <h1>Built for Athletes<br>Who Do It All</h1>
</div>
<img class="product-img" src="https://cdn.shopify.com/s/files/1/0775/5956/2452/files/08.png?v=1776313172" alt="">
<div class="bottom">
  <div class="stats">
    <div>
      <div class="stat-num">Top 14%</div>
      <div class="stat-label">Energy Return</div>
    </div>
    <div>
      <div class="stat-num">285g</div>
      <div class="stat-label">Weight</div>
    </div>
    <div>
      <div class="stat-num">218%</div>
      <div class="stat-label">Funded</div>
    </div>
  </div>
  <div class="price-row">
    <span class="price">$129</span>
  </div>
  <div class="free">Free US Shipping &bull; No Import Duties</div>
</div>
</body></html>
