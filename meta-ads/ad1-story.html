<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;font-family:'Inter','Helvetica Neue',sans-serif;
  background:#0a0a0a;color:#fff;overflow:hidden;position:relative}
.product-img{width:100%;height:1100px;object-fit:cover;display:block}
.content{padding:64px;display:flex;flex-direction:column;justify-content:center;
  height:820px;position:relative}
.badge{display:inline-block;border:1px solid #444;color:#fff;font-size:16px;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;padding:10px 20px;margin-bottom:28px;
  align-self:flex-start}
h1{font-size:64px;font-weight:700;letter-spacing:-1.5px;line-height:1.05;margin-bottom:20px}
.sub{font-size:24px;color:#a3a3a3;font-weight:400;line-height:1.4;margin-bottom:40px}
.price-row{display:flex;align-items:baseline;gap:16px;margin-bottom:16px}
.price{font-size:56px;font-weight:700}
.price-note{font-size:20px;color:#737373}
.cta{display:inline-block;background:#fff;color:#0a0a0a;font-size:18px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;padding:18px 48px;align-self:flex-start}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<img class="product-img" src="https://cdn.shopify.com/s/files/1/0775/5956/2452/files/dariamti_shoe.jpg?v=1776313172" alt="">
<div class="content">
  <div class="badge">REXtream Champion</div>
  <h1>One Shoe.<br>Every<br>Movement.</h1>
  <p class="sub">Jump. Lunge. Run.<br>Top 14% energy return.</p>
  <div class="price-row">
    <span class="price">$129</span>
    <span class="price-note">Free shipping</span>
  </div>
  <div class="cta">Shop Now</div>
</div>
</body></html>
