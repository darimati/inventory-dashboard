<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;font-family:'Inter','Helvetica Neue',sans-serif;
  background:#0a0a0a;color:#fff;overflow:hidden;position:relative}
.split{display:grid;grid-template-columns:1fr 1fr;height:100%}
.left{padding:80px 56px;display:flex;flex-direction:column;justify-content:center}
.right{overflow:hidden}
.right img{width:100%;height:100%;object-fit:cover}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;
  color:#a3a3a3;margin-bottom:24px}
h1{font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1.15;margin-bottom:20px}
.stat{margin-bottom:16px}
.stat-num{font-size:36px;font-weight:700;color:#fff}
.stat-label{font-size:14px;color:#737373;text-transform:uppercase;letter-spacing:1.5px}
.divider{width:48px;height:2px;background:#333;margin:28px 0}
.price{font-size:40px;font-weight:700}
.price-sub{font-size:16px;color:#737373;margin-top:4px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="split">
  <div class="left">
    <p class="eyebrow">Lab-Tested Performance</p>
    <h1>Top 14%<br>Energy Return</h1>
    <div class="stat">
      <div class="stat-num">67.5%</div>
      <div class="stat-label">Heel Energy Return</div>
    </div>
    <div class="stat">
      <div class="stat-num">68.7%</div>
      <div class="stat-label">Forefoot Energy Return</div>
    </div>
    <div class="divider"></div>
    <div class="price">$129</div>
    <div class="price-sub">vs $190 competitors</div>
  </div>
  <div class="right">
    <img src="https://cdn.shopify.com/s/files/1/0775/5956/2452/files/04.png?v=1776313172" alt="">
  </div>
</div>
</body></html>
