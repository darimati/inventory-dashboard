<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;font-family:'Inter','Helvetica Neue',sans-serif;
  background:#fff;overflow:hidden;position:relative}
.hero-img{width:100%;height:660px;object-fit:cover;display:block}
.content{padding:48px 64px;position:relative}
.badge{display:inline-block;background:#0a0a0a;color:#fff;font-size:18px;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;padding:8px 20px;margin-bottom:20px}
h1{font-size:52px;font-weight:700;letter-spacing:-1px;line-height:1.1;color:#0a0a0a;margin-bottom:12px}
.sub{font-size:24px;color:#737373;font-weight:400;margin-bottom:24px}
.price-row{display:flex;align-items:baseline;gap:16px}
.price{font-size:48px;font-weight:700;color:#0a0a0a}
.price-note{font-size:20px;color:#a3a3a3;font-weight:400}
.logo{position:absolute;bottom:48px;right:64px;height:28px;opacity:.4}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<img class="hero-img" src="https://cdn.shopify.com/s/files/1/0775/5956/2452/files/dariamti_shoe.jpg?v=1776313172" alt="">
<div class="content">
  <div class="badge">REXtream 2026 Champion</div>
  <h1>One Shoe.<br>Every Movement.</h1>
  <p class="sub">Jump. Lunge. Run. No compromise.</p>
  <div class="price-row">
    <span class="price">$129</span>
    <span class="price-note">Free US Shipping</span>
  </div>
</div>
</body></html>
